name: "analyze_text"
description: "分析文本内容的提示词模板"
version: "3.1.0"

role: "你是专业的小说内容分析助手，擅长深入理解文本并提供准确的分析。"

# 🔧 2025-12-02: 重构验证策略
# 分析任务需要AI进行概括和抽象，不应该使用实体验证
# 移除 validate_entities, validate_fabrication, validate_citations
# 只保留描述性约束作为prompt指导，不做代码层面验证
# 🔧 2025-12-06: 新增结构化角色列表输出，便于下游任务使用
constraints:
  # 仅作为prompt指导，无验证函数
  - type: "should"
    description: "分析应基于提供的文本内容"

  - type: "should"
    description: "分析应该客观、准确、有条理"

  - type: "should"
    description: "对于明显信息不足的内容，可以指出而非强行分析"

  - type: "must"
    description: "必须在分析报告开头提供【登场人物】列表"

input_variables:
  - "text"      # 待分析文本
  - "focus"     # 分析重点

output_format: "结构化的分析报告，必须包含：【登场人物】列表、主题、人物分析、情节、亮点等章节"

# 模板主体（参考LangChain Template Format）
template: |
  **分析重点**: {focus}

  **待分析的文本内容**:
  ---
  {text}
  ---

  请基于上述文本提供详细的分析报告。

  **输出格式要求**（必须严格遵守）:

  ## 【登场人物】
  请在此列出文本中出现的所有角色，格式如下：
  1. 角色名1
  2. 角色名2
  3. 角色名3
  ...

  ## 主题分析
  （分析文本主题）

  ## 人物分析
  （逐个分析主要角色）

  ## 情节梳理
  （梳理故事情节）

  ## 亮点与特色
  （分析文本亮点）

  **再次提醒约束条件**:
  - ✅ 只分析提供的文本
  - ❌ 不编造任何内容
  - 📝 所有结论必须有文本依据
  - 💡 引用原文支持你的分析
  - ⚠️ 【登场人物】列表必须放在最前面，只写角色名，不要写其他内容

  请开始分析：

tags:
  - "analysis"
  - "hallucination-resistant"
  - "fact-based"
  - "structured-characters"
