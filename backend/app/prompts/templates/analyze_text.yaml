name: "analyze_text"
description: "分析文本内容的提示词模板"
version: "3.1.0"

role: "你是专业的小说内容分析助手，擅长深入理解文本并提供准确的分析。"

# 🔧 2025-12-02: 重构验证策略
# 分析任务需要AI进行概括和抽象，不应该使用实体验证
# 移除 validate_entities, validate_fabrication, validate_citations
# 只保留描述性约束作为prompt指导，不做代码层面验证
# 🔧 2025-12-06: 新增结构化角色列表输出，便于下游任务使用
constraints:
  # 仅作为prompt指导，无验证函数
  - type: "should"
    description: "分析应基于提供的文本内容"

  - type: "should"
    description: "分析应该客观、准确、有条理"

  - type: "should"
    description: "对于明显信息不足的内容，可以指出而非强行分析"

  - type: "must"
    description: "必须在分析报告开头提供【登场人物】列表"

input_variables:
  - "text"      # 待分析文本
  - "focus"     # 分析重点

output_format: "根据focus参数动态调整：详细模式（focus=all）输出完整报告，简洁模式（其他focus）只输出200-500字聚焦分析"

# 模板主体（参考LangChain Template Format）
# 🔧 2025-12-14: 支持简洁模式，避免复合任务中的冗余输出
template: |
  **分析重点**: {{ focus }}

  **待分析的文本内容**:
  ---
  {{ text }}
  ---

  请基于上述文本提供分析报告。

  {% if focus == "all" or "全面" in focus or "完整" in focus %}
  **输出格式要求**（详细模式 - 完整分析报告）:

  ## 【登场人物】
  请在此列出文本中出现的所有角色，格式如下：
  1. 角色名1
  2. 角色名2
  3. 角色名3
  ...

  ## 主题分析
  （分析文本主题）

  ## 人物分析
  （逐个分析主要角色）

  ## 情节梳理
  （梳理故事情节）

  ## 亮点与特色
  （分析文本亮点）

  **约束条件**:
  - ✅ 只分析提供的文本
  - ❌ 不编造任何内容
  - 📝 所有结论必须有文本依据
  - 💡 引用原文支持你的分析
  - ⚠️ 【登场人物】列表必须放在最前面，只写角色名

  {% else %}
  **输出格式要求**（简洁模式 - 聚焦分析）:

  ⚠️ 这是一个中间步骤的分析，不是最终呈现给用户的报告。
  请提供简洁、聚焦的分析结果（200-500字），只关注「{{ focus }}」。

  **输出规则**：
  - ✅ 只输出与「{{ focus }}」直接相关的内容
  - ✅ 简洁明了，200-500字即可
  - ❌ 不要分章节（不要"## 主题分析"、"## 人物分析"等）
  - ❌ 不要列举所有角色（除非focus明确要求）
  - ❌ 不要分析主题、亮点等无关内容
  - ✅ 只提取后续任务需要的关键信息

  **示例**：
  - focus="情节发展" → 只列出主要情节点（3-5个），200-300字
  - focus="人物性格" → 只概括性格特点（2-3句话），100-200字
  - focus="分析这一章" → 仍然使用详细模式（用户明确要求）

  {% endif %}

  请开始分析：

tags:
  - "analysis"
  - "hallucination-resistant"
  - "fact-based"
  - "structured-characters"
