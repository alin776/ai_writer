version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: novelaide_postgres
    environment:
      POSTGRES_USER: novelaide
      POSTGRES_PASSWORD: novelaide_password
      POSTGRES_DB: novelaide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novelaide_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelaide"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis/redis-stack-server:latest
    container_name: novelaide_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novelaide_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenSearch 检索
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: novelaide_opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - novelaide_network

  # FastAPI 应用
  backend:
    build: .
    container_name: novelaide_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://novelaide:novelaide_password@postgres:5432/novelaide
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DEBUG=True
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - ENABLE_SCHEDULER=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - novelaide_network
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  # LightRAG 知识检索
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag
    restart: unless-stopped
    ports:
      - "9621:9621"
    volumes:
      - lightrag_data:/app/data/rag_storage
    environment:
      - HOST=0.0.0.0
      - PORT=9621
      - WORKSPACE=ai_writer_e2e_fullbook_v1
      # LLM（与后端共用同一个 Gemini 代理）
      - LLM_BINDING=openai
      - LLM_MODEL=gemini-2.5-pro
      - LLM_BINDING_HOST=${OPENAI_BASE_URL:-https://204992.xyz:8443/v1}
      - LLM_BINDING_API_KEY=${OPENAI_API_KEY}
      # Embedding（使用 Ollama bge-m3）
      - EMBEDDING_BINDING=ollama
      - EMBEDDING_MODEL=bge-m3:latest
      - EMBEDDING_DIM=1024
      - EMBEDDING_BINDING_HOST=http://host.docker.internal:11434
      - EMBEDDING_FUNC_MAX_ASYNC=1
      - EMBEDDING_BATCH_NUM=1
      - EMBEDDING_TIMEOUT=120
      # Rerank（暂不启用，本地无 GPU 无法运行 reranker）
      - RERANK_BINDING=null
      # 性能参数
      - MAX_ASYNC=2
      - MAX_PARALLEL_INSERT=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - novelaide_network

  # Scheduler 独立进程，避免多实例重复跑定时任务
  scheduler:
    build: .
    container_name: novelaide_scheduler
    command: ["python", "-m", "app.tasks.scheduler_runner"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://novelaide:novelaide_password@postgres:5432/novelaide
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DEBUG=True
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - ENABLE_SCHEDULER=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - novelaide_network
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  lightrag_data:

networks:
  novelaide_network:
    driver: bridge
