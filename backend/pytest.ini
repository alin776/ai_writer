# Pytest 配置文件

[tool:pytest]
# 测试文件路径
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py

# 测试函数匹配模式
python_functions = test_*

# 测试类匹配模式
python_classes = Test*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 异步测试支持
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module

# 标记
markers =
    slow: 慢速测试
    api: API测试
    unit: 单元测试
    integration: 集成测试

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
