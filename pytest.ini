[tool:pytest]
# Pytest 配置文件

# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    -p no:warnings

# 标记（markers）
markers =
    asyncio: mark test as async test
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test

# 异步支持
asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# 超时设置（需要pytest-timeout插件）
timeout = 300
timeout_method = thread

# 失败重试（需要pytest-rerunfailures插件）
# 默认不启用，可通过命令行 --reruns 3 启用
