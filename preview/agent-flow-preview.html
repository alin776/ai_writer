<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 执行轨迹预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }

    .chat-area {
      padding: 20px;
      min-height: 400px;
    }

    /* 用户消息 */
    .user-message {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .user-bubble {
      background: #6366f1;
      color: white;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 80%;
      font-size: 14px;
    }

    /* Agent 消息区域 */
    .agent-message {
      margin-bottom: 16px;
    }

    .agent-avatar {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      margin-bottom: 8px;
    }

    /* AI 思考文字 */
    .thinking-text {
      color: #6b7280;
      font-size: 13px;
      margin: 8px 0;
      padding-left: 4px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInUp 0.3s ease forwards;
    }

    /* 工具卡片 */
    .tool-card {
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin: 8px 0;
      background: white;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInUp 0.3s ease forwards;
    }

    .tool-card.running {
      border-color: #a5b4fc;
      background: #f5f3ff;
    }

    .tool-card.done {
      border-color: #86efac;
      background: #f0fdf4;
    }

    .tool-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tool-icon svg {
      width: 14px;
      height: 14px;
    }

    .tool-icon.running svg { color: #6366f1; }
    .tool-icon.done svg { color: #10b981; }

    .tool-content {
      flex: 1;
      min-width: 0;
    }

    .tool-title {
      font-size: 13px;
      font-weight: 500;
      color: #1f2937;
    }

    .tool-tags {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .tool-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0f2fe;
      color: #0369a1;
    }

    .tool-tag.param {
      background: #ede9fe;
      color: #7c3aed;
    }

    .tool-status {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
    }

    /* 旋转动画 */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .check-icon {
      color: #10b981;
    }

    /* Agent 回复内容 */
    .agent-content {
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: #6366f1;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    /* 控制按钮 */
    .controls {
      padding: 16px 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
    }

    .btn-primary:hover { background: #4f46e5; }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover { background: #e5e7eb; }

    /* 动画 */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* 隐藏元素 */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10H12V2z"/>
          <path d="M12 2a10 10 0 0 1 10 10"/>
        </svg>
      </div>
      <div class="header-title">AI 写作助手</div>
    </div>

    <div class="chat-area" id="chatArea">
      <!-- 用户消息 -->
      <div class="user-message">
        <div class="user-bubble">帮我续写第3章，大约2000字</div>
      </div>

      <!-- Agent 消息 -->
      <div class="agent-message">
        <div class="agent-avatar">AI</div>
        <div id="flowContainer"></div>
        <div class="agent-content hidden" id="agentContent"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" onclick="startDemo()">开始演示</button>
      <button class="btn btn-secondary" onclick="resetDemo()">重置</button>
    </div>
  </div>

  <script>
    // 模拟执行流程数据
    const flowSteps = [
      {
        type: 'thinking',
        content: '我先读取第3章的内容，了解当前的故事进展：'
      },
      {
        type: 'tool',
        icon: 'file',
        title: '读取章节',
        tags: ['工具调用', '第3章'],
        delay: 1500
      },
      {
        type: 'thinking',
        content: '接下来分析文本风格和情节走向：'
      },
      {
        type: 'tool',
        icon: 'chart',
        title: '分析文本',
        tags: ['工具调用', '风格分析'],
        delay: 1200
      },
      {
        type: 'thinking',
        content: '然后开始续写内容：'
      },
      {
        type: 'tool',
        icon: 'pen',
        title: '续写内容',
        tags: ['工具调用', '约2000字'],
        delay: 2000
      }
    ];

    const finalContent = `林晓站在窗前，望着远处渐渐暗淡的天际线。城市的霓虹灯开始次第亮起，像是无数双眼睛在黑暗中闪烁。

她的手机震动了一下，是陈默发来的消息："今晚有空吗？想和你聊聊那件事。"

那件事。林晓苦笑了一下，她知道陈默指的是什么。三年前的那个夜晚，改变了他们所有人的命运...`;

    let currentStep = 0;
    let isRunning = false;

    // SVG 图标
    const icons = {
      file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>`,
      chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>`,
      pen: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        <path d="M2 2l7.586 7.586"/>
      </svg>`,
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>`
    };

    function createThinkingElement(content) {
      const div = document.createElement('div');
      div.className = 'thinking-text';
      div.textContent = content;
      return div;
    }

    function createToolCard(step) {
      const div = document.createElement('div');
      div.className = 'tool-card running';
      div.innerHTML = `
        <div class="tool-icon running">${icons[step.icon]}</div>
        <div class="tool-content">
          <div class="tool-title">${step.title}</div>
          <div class="tool-tags">
            ${step.tags.map((tag, i) =>
              `<span class="tool-tag ${i > 0 ? 'param' : ''}">${tag}</span>`
            ).join('')}
          </div>
        </div>
        <div class="tool-status">
          <div class="spinner"></div>
        </div>
      `;
      return div;
    }

    function completeToolCard(card) {
      card.className = 'tool-card done';
      card.querySelector('.tool-icon').className = 'tool-icon done';
      card.querySelector('.tool-status').innerHTML = `
        <span class="check-icon">${icons.check}</span>
      `;
    }

    async function typeWriter(element, text) {
      element.classList.remove('hidden');
      let i = 0;
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      element.appendChild(cursor);

      while (i < text.length && isRunning) {
        element.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        await sleep(15);
      }
      cursor.remove();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startDemo() {
      if (isRunning) return;

      // 先清空内容，再设置运行状态
      document.getElementById('flowContainer').innerHTML = '';
      const contentEl = document.getElementById('agentContent');
      contentEl.innerHTML = '';
      contentEl.classList.add('hidden');

      isRunning = true;

      const container = document.getElementById('flowContainer');

      for (const step of flowSteps) {
        if (!isRunning) break;

        if (step.type === 'thinking') {
          const el = createThinkingElement(step.content);
          container.appendChild(el);
          await sleep(300);
        } else if (step.type === 'tool') {
          const card = createToolCard(step);
          container.appendChild(card);
          await sleep(step.delay);
          if (isRunning) completeToolCard(card);
          await sleep(200);
        }
      }

      if (isRunning) {
        await sleep(300);
        await typeWriter(contentEl, finalContent);
      }

      isRunning = false;
    }

    function resetDemo() {
      isRunning = false;
      document.getElementById('flowContainer').innerHTML = '';
      const contentEl = document.getElementById('agentContent');
      contentEl.innerHTML = '';
      contentEl.classList.add('hidden');
    }
  </script>
</body>
</html>
