<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord风格右键菜单预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #36393f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      gap: 60px;
      flex-wrap: wrap;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 对比标签 */
    .compare-label {
      background: #5865f2;
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .compare-label.other {
      background: #3ba55c;
    }

    /* 右键菜单容器 - Discord风格 */
    .context-menu {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 2px 10px rgba(0,0,0,.1);
      width: 188px;
      padding: 6px 8px;
    }

    .context-menu.dark {
      background: #18191c;
      box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 8px 16px rgba(0,0,0,.24);
    }

    /* 顶部快捷表情栏 - Discord风格：无背景纯表情 */
    .quick-reactions {
      display: flex;
      justify-content: flex-start;
      gap: 2px;
      padding: 4px 0 8px 0;
    }

    .quick-reaction-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .quick-reaction-btn:hover {
      background: rgba(79, 84, 92, 0.16);
      transform: scale(1.15);
    }

    .context-menu.dark .quick-reaction-btn:hover {
      background: rgba(79, 84, 92, 0.6);
    }

    /* 添加反应行（和快捷表情同一区块） */
    .add-reaction-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      margin: 0 -8px;
      cursor: pointer;
      border-radius: 2px;
      font-size: 14px;
      color: #4f5660;
    }

    .add-reaction-row:hover {
      background: #5865f2;
      color: #fff;
    }

    .context-menu.dark .add-reaction-row {
      color: #b9bbbe;
    }

    .context-menu.dark .add-reaction-row:hover {
      background: #5865f2;
      color: #fff;
    }

    /* 分隔线 */
    .menu-divider {
      height: 1px;
      background: #e3e5e8;
      margin: 4px 0;
    }

    .context-menu.dark .menu-divider {
      background: #2e3035;
    }

    /* 菜单项 - Discord风格 */
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      margin: 0 -8px;
      cursor: pointer;
      transition: background 0.1s;
      font-size: 14px;
      color: #4f5660;
      border-radius: 2px;
    }

    .menu-item:hover {
      background: #5865f2;
      color: #fff;
    }

    .menu-item:hover .icon {
      color: #fff;
    }

    .context-menu.dark .menu-item {
      color: #b9bbbe;
    }

    .context-menu.dark .menu-item:hover {
      background: #5865f2;
      color: #fff;
    }

    /* 危险操作（红色） */
    .menu-item.danger {
      color: #ed4245;
    }

    .menu-item.danger:hover {
      background: #ed4245;
      color: #fff;
    }

    .context-menu.dark .menu-item.danger {
      color: #ed4245;
    }

    .context-menu.dark .menu-item.danger:hover {
      background: #ed4245;
      color: #fff;
    }

    /* SVG 图标 */
    .icon {
      width: 18px;
      height: 18px;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .menu-item:hover .icon {
      opacity: 1;
    }

    .arrow-icon {
      width: 10px;
      height: 10px;
      opacity: 0.6;
    }
  </style>
</head>

  <!-- Discord风格（浅色）- 自己的消息 -->

          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>

      <!-- 置顶 -->

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="3"/>

      <div class="menu-divider"></div>

      <!-- 复制文字 -->

          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </div>

      <!-- 复制消息链接 -->
      <div class="menu-item">

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>

      <div class="menu-divider"></div>

      <!-- 添加到表情（有图片时显示） -->

        <span>添加到表情</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>

      <!-- 撤回 -->
      <div class="menu-item danger">
        <span>撤回消息</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </div>

      <div class="menu-divider"></div>

      <!-- 举报 -->

          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
      </div>
    </div>
  </div>
