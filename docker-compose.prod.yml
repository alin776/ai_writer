# ============================================
# 文枢AI 生产环境 Docker Compose
# ============================================

version: '3.8'

services:
  # ==================== 数据库 ====================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wenshu_postgres
    restart: always
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POSTGRES_USER: ${DB_USER:-novelaide}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novelaide_password}
      POSTGRES_DB: ${DB_NAME:-novelaide}
      TZ: Asia/Shanghai
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=2MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wenshu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelaide"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 缓存 ====================
  redis:
    image: redis/redis-stack-server:latest
    container_name: wenshu_redis
    restart: always
    command: redis-stack-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - wenshu_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端API ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wenshu_backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
    env_file:
      - ./backend/.env.prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-novelaide}:${DB_PASSWORD:-novelaide_password}@postgres:5432/${DB_NAME:-novelaide}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_SCHEDULER=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wenshu_network
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      # Docker socket 挂载：允许后端创建沙箱容器（DooD 模式）
      - /var/run/docker.sock:/var/run/docker.sock
      # 数据目录 bind mount：宿主机与沙箱容器共享同一路径
      - ${DATA_HOST_PATH:-./backend-data}:/app/data
    # Docker socket 权限：将容器用户加入宿主机 docker 组
    group_add:
      - "${DOCKER_GID:-999}"

  # ==================== 前端 + Nginx ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: wenshu_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - wenshu_network

# ==================== 数据卷 ====================
volumes:
  postgres_data:
    name: wenshu_postgres_data
  redis_data:
    name: wenshu_redis_data
  backend_logs:
    name: wenshu_backend_logs
  backend_uploads:
    name: wenshu_backend_uploads

# ==================== 网络 ====================
networks:
  wenshu_network:
    name: wenshu_network
    driver: bridge
