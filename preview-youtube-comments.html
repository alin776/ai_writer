<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 风格评论区预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* 顶部区域 */
    .comments-header {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 24px;
    }

    .comments-count {
      font-size: 16px;
      font-weight: 500;
    }

    .sort-button {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #f1f1f1;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 0;
    }

    .sort-button:hover {
      color: #aaa;
    }

    .sort-button svg {
      width: 20px;
      height: 20px;
    }

    /* 评论输入区域 */
    .comment-input-area {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar.small {
      width: 24px;
      height: 24px;
      font-size: 12px;
    }

    .input-wrapper {
      flex: 1;
    }

    .comment-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #303030;
      color: #f1f1f1;
      font-size: 14px;
      padding: 8px 0;
      outline: none;
      transition: border-color 0.2s;
    }

    .comment-input:focus {
      border-bottom-color: #f1f1f1;
    }

    .comment-input::placeholder {
      color: #aaa;
    }

    /* 输入框展开后的操作栏 */
    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .input-actions.hidden {
      display: none;
    }

    .emoji-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
    }

    .emoji-btn:hover {
      background: #272727;
    }

    .input-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-cancel {
      background: none;
      border: none;
      color: #f1f1f1;
      font-size: 14px;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 18px;
    }

    .btn-cancel:hover {
      background: #272727;
    }

    .btn-submit {
      background: #3ea6ff;
      border: none;
      color: #0f0f0f;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 18px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #65b8ff;
    }

    .btn-submit:disabled {
      background: #272727;
      color: #717171;
      cursor: not-allowed;
    }

    /* 评论列表 */
    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 单条评论 */
    .comment-item {
      display: flex;
      gap: 16px;
    }

    .comment-content {
      flex: 1;
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .comment-username {
      font-size: 13px;
      font-weight: 500;
      color: #f1f1f1;
    }

    .comment-time {
      font-size: 12px;
      color: #aaa;
    }

    .comment-menu {
      margin-left: auto;
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .comment-item:hover .comment-menu {
      opacity: 1;
    }

    .comment-menu:hover {
      background: #272727;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.6;
      color: #f1f1f1;
      margin-bottom: 8px;
    }

    /* 评论操作栏 */
    .comment-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: -8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
    }

    .action-btn:hover {
      background: #272727;
    }

    .action-btn.liked {
      color: #3ea6ff;
    }

    .action-btn.liked svg {
      stroke: #3ea6ff;
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
    }

    .like-count {
      font-size: 12px;
      color: #aaa;
      margin-left: -4px;
      margin-right: 4px;
    }

    .reply-btn {
      background: none;
      border: none;
      color: #f1f1f1;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 18px;
    }

    .reply-btn:hover {
      background: #272727;
    }

    /* 展开回复按钮 */
    .show-replies-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #3ea6ff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      margin-left: -16px;
      margin-top: 4px;
      border-radius: 18px;
    }

    .show-replies-btn:hover {
      background: rgba(62, 166, 255, 0.1);
    }

    .show-replies-btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.2s;
    }

    .show-replies-btn.expanded svg {
      transform: rotate(180deg);
    }

    /* 回复列表 */
    .replies-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reply-item {
      display: flex;
      gap: 16px;
    }

    .reply-item .avatar {
      width: 24px;
      height: 24px;
      font-size: 10px;
    }

    .reply-to {
      color: #3ea6ff;
      font-size: 14px;
      cursor: pointer;
    }

    .reply-to:hover {
      text-decoration: underline;
    }

    /* 回复输入框 */
    .reply-input-area {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .reply-input-area .avatar {
      width: 24px;
      height: 24px;
      font-size: 10px;
    }

    /* 分隔线 */
    .divider {
      height: 1px;
      background: #303030;
      margin: 16px 0;
    }

    /* 用户评分显示 */
    .user-rating {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
    }

    .user-rating svg {
      width: 12px;
      height: 12px;
    }

    .user-rating svg.filled {
      fill: #f1c40f;
      color: #f1c40f;
    }

    .user-rating svg.empty {
      fill: none;
      color: #717171;
    }
  </style>
</head>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M17 2V13M22 11V4C22 2.9 21.1 2 20 2H6.6C5.4 2 4.4 2.8 4.1 4L2.3 11C1.9 12.4 3 13.8 4.4 13.8H9.5L8.6 17.8C8.5 18.5 8.7 19.2 9.2 19.7L10 20.5L16.2 13.7C16.7 13.2 17 12.5 17 11.8V2Z"/>
            </svg>
          </button>
          <button class="reply-btn">回复</button>
        </div>

        <!-- 回复输入框（展开状态示例） -->
        <div class="reply-input-area">
          <div class="avatar">我</div>
          <div class="input-wrapper">
            <input type="text" class="comment-input" placeholder="添加回复..." value="写得真好！">
            <div class="input-actions">
              <button class="emoji-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-6c.78 2.34 2.72 4 5 4s4.22-1.66 5-4H7zm8-4c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm-6 0c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1z"/>
                </svg>
              </button>
              <div class="input-buttons">
                <button class="btn-cancel">取消</button>
                <button class="btn-submit">回复</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 展开回复按钮 -->
        <button class="show-replies-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
          4 条回复
        </button>
      </div>
    </div>

    <!-- 评论 4 - 无评分 -->
    <div class="comment-item">
      <div class="avatar" style="background: #00bcd4;">新</div>
      <div class="comment-content">
        <div class="comment-header">
          <span class="comment-username">@新读者</span>
          <span class="comment-time">刚刚</span>
          <button class="comment-menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </button>
        </div>
        <p class="comment-text">刚刚开始看，感觉不错！</p>
        <div class="comment-actions">
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M7 22V11M2 13V20C2 21.1 2.9 22 4 22H17.4C18.6 22 19.6 21.2 19.9 20L21.7 13C22.1 11.6 21 10.2 19.6 10.2H14.5L15.4 6.2C15.5 5.5 15.3 4.8 14.8 4.3L14 3.5L7.8 10.3C7.3 10.8 7 11.5 7 12.2V22Z"/>
            </svg>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M17 2V13M22 11V4C22 2.9 21.1 2 20 2H6.6C5.4 2 4.4 2.8 4.1 4L2.3 11C1.9 12.4 3 13.8 4.4 13.8H9.5L8.6 17.8C8.5 18.5 8.7 19.2 9.2 19.7L10 20.5L16.2 13.7C16.7 13.2 17 12.5 17 11.8V2Z"/>
            </svg>
          </button>
          <button class="reply-btn">回复</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载更多 -->
  <div style="text-align: center; margin-top: 24px;">
    <button class="reply-btn" style="color: #3ea6ff;">加载更多评论</button>
  </div>

  <script>
    function showInputActions() {
      document.getElementById('inputActions').classList.remove('hidden');
    }

    function hideInputActions() {
      document.getElementById('inputActions').classList.add('hidden');
      document.getElementById('mainInput').value = '';
      document.getElementById('mainInput').blur();
    }

    function toggleReplies(btn) {
      btn.classList.toggle('expanded');
      const repliesList = btn.previousElementSibling?.previousElementSibling;
      if (repliesList && repliesList.classList.contains('replies-list')) {
        repliesList.style.display = repliesList.style.display === 'none' ? 'flex' : 'none';
        btn.innerHTML = repliesList.style.display === 'none'
          ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg> 33 条回复'
          : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg> 隐藏回复';
      }
    }
  </script>
